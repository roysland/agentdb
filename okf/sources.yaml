    usage_context: The uuid library is used to generate unique identifiers for database records in the memory and MCP command handlers, specifically via the uuid.New() function to produce RFC 4122 version 4 UUIDs; no build tags or conditional compilation constraints are present.

  - name: tiktoken-go
    url: https://github.com/pkoukk/tiktoken-go
