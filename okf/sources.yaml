  - name: fsnotify
    url: https://github.com/fsnotify/fsnotify
    usage_context: The project uses fsnotify to monitor file system events for directory watching, specifically in the internal/watch package where it's integrated with debouncing logic to handle rapid file changes; there are no build tags or conditional imports, indicating it's a direct, unconditional dependency for file watching functionality.

  - name: uuid
