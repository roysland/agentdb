    usage_context: The project uses go-gitignore to parse and evaluate .gitignore patterns for filtering files during indexing, specifically leveraging the library’s `NewGitIgnore` and `Match` functions to determine whether a given file path should be ignored based on repository .gitignore rules. There are no build tags or conditional compilation constraints observed; the dependency is imported unconditionally in the filefilter package.

  - name: go-tree-sitter
